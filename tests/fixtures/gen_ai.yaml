groups:
  - id: registry.gen_ai
    type: attribute_group
    display_name: GenAI Attributes
    brief: Attributes for Generative AI telemetry.
    attributes:
      - id: gen_ai.system
        stability: development
        type:
          members:
            - id: openai
              value: openai
              brief: OpenAI
              stability: development
            - id: anthropic
              value: anthropic
              brief: Anthropic
              stability: development
        brief: The GenAI product as identified by the instrumentation.
      - id: gen_ai.request.model
        stability: development
        type: string
        brief: The name of the GenAI model a request is being made to.
      - id: gen_ai.response.model
        stability: development
        type: string
        brief: The name of the model that generated the response.
      - id: gen_ai.request.temperature
        stability: development
        type: double
        brief: The temperature setting for the GenAI request.
      - id: gen_ai.request.top_p
        stability: development
        type: double
        brief: The top_p sampling setting for the GenAI request.
      - id: gen_ai.request.max_tokens
        stability: development
        type: int
        brief: The maximum number of tokens the model may generate.
      - id: gen_ai.response.id
        stability: development
        type: string
        brief: The unique identifier for the completion.
      - id: gen_ai.response.finish_reasons
        stability: development
        type: string[]
        brief: The reasons the model stopped generating tokens, one per choice.
      - id: gen_ai.usage.input_tokens
        stability: development
        type: int
        brief: Number of tokens used in the prompt.
      - id: gen_ai.operation.name
        stability: development
        type:
          members:
            - id: chat
              value: chat
              brief: Chat completion operation.
              stability: development
            - id: text_completion
              value: text_completion
              brief: Text completion operation.
              stability: development
            - id: embeddings
              value: embeddings
              brief: Embeddings operation.
              stability: development
            - id: generate_content
              value: generate_content
              brief: Multimodal content generation.
              stability: development
        brief: The name of the operation being performed.

  - id: span.gen_ai.client
    type: span
    span_kind: client
    stability: development
    brief: Describes a GenAI client operation.
    attributes:
      - ref: gen_ai.system
        requirement_level: required
      - ref: gen_ai.request.model
        requirement_level: required
